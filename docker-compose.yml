services:
  app:
    build: .
    image: personal-site:latest
    container_name: personal-site
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      # Edit anything under ./content on the Pi, then:
      #   docker compose restart app
      # No rebuild needed for content changes.
      - ./content:/app/content:ro
